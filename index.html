
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VARCONE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap');
  :root { --dark:#0F1923;--mid:#1C2B3A;--card:#162030;--blue:#2D9CDB;--green:#27AE60;--red:#E74C3C;--gold:#F2C94C;--text:#ECF0F1;--muted:#7F8C8D;--border:#2C3E50;--r:14px; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  .screen{display:none;width:100%;max-width:420px;min-height:100vh;flex-direction:column;}
  .screen.active{display:flex;}
  #login{justify-content:center;align-items:center;padding:40px 24px;gap:32px;}
  .brand{font-family:'Space Mono',monospace;font-size:34px;font-weight:700;letter-spacing:6px;color:var(--gold);text-align:center;text-shadow:0 0 30px rgba(242,201,76,.3);}
  .sub{font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;text-align:center;margin-top:6px;}
  .login-box{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:28px 24px;display:flex;flex-direction:column;gap:16px;}
  .field label{display:block;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .field select,.field input{width:100%;background:var(--mid);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;padding:14px 16px;outline:none;appearance:none;transition:border-color .2s;}
  .field select:focus,.field input:focus{border-color:var(--blue);}
  .btn-gold{width:100%;background:var(--gold);color:var(--dark);border:none;border-radius:10px;font-family:'Space Mono',monospace;font-size:14px;font-weight:700;letter-spacing:2px;padding:16px;cursor:pointer;}
  .btn-gold:active{opacity:.85;transform:scale(.98);}
  .err{color:var(--red);font-size:13px;text-align:center;min-height:18px;}
  .topbar{background:var(--mid);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  .topbar .brand{font-size:16px;letter-spacing:4px;}
  .user-pill{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--muted);}
  .user-pill span{color:var(--text);font-weight:700;}
  .logout{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;}
  .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--mid);border-bottom:1px solid var(--border);position:sticky;top:53px;z-index:9;}
  .tab-btn{background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;letter-spacing:1px;padding:14px;cursor:pointer;text-transform:uppercase;transition:all .2s;}
  .tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
  .tab-pane{display:none;padding:20px;}
  .tab-pane.active{display:block;}
  .type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
  .type-btn{background:var(--card);border:2px solid var(--border);border-radius:12px;color:var(--muted);font-family:'Space Mono',monospace;font-size:13px;font-weight:700;letter-spacing:2px;padding:20px 12px;cursor:pointer;transition:all .2s;text-align:center;}
  .type-btn.entrada.active{border-color:var(--green);background:rgba(39,174,96,.12);color:var(--green);}
  .type-btn.salida.active{border-color:var(--red);background:rgba(231,76,60,.12);color:var(--red);}
  .form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:20px;}
  .field input.big{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;letter-spacing:2px;text-transform:uppercase;text-align:center;}
  .field input.big[type=number]{font-size:28px;}
  input::placeholder{color:#3A4A5A;font-size:15px;letter-spacing:1px;font-weight:400;}
  .btn-submit{width:100%;border:none;border-radius:12px;font-family:'Space Mono',monospace;font-size:15px;font-weight:700;letter-spacing:2px;padding:20px;cursor:pointer;transition:all .2s;}
  .btn-submit.e{background:var(--green);color:#fff;}
  .btn-submit.s{background:var(--red);color:#fff;}
  .btn-submit:disabled{opacity:.5;cursor:not-allowed;}
  .btn-submit:not(:disabled):active{transform:scale(.97);}
  .mov-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;animation:up .25s ease;}
  @keyframes up{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  .mov-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .badge{font-size:10px;font-weight:700;letter-spacing:2px;padding:4px 10px;border-radius:20px;text-transform:uppercase;}
  .badge.e{background:rgba(39,174,96,.2);color:var(--green);}
  .badge.s{background:rgba(231,76,60,.2);color:var(--red);}
  .mov-sku{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;color:var(--gold);}
  .mov-meta{font-size:12px;color:var(--muted);margin-top:4px;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:48px 0;}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--green);color:#fff;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;letter-spacing:1px;padding:14px 24px;border-radius:40px;transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:100;white-space:nowrap;}
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.err{background:var(--red);}
  select option{background:var(--mid);}
</style>
</head>
<body>

<div class="screen active" id="login">
  <div>
    <div class="brand">VARCONE</div>
    <div class="sub">Sistema de gestión</div>
  </div>
  <div class="login-box">
    <div class="field">
      <label>Usuario</label>
      <select id="sel-user">
        <option value="">— Seleccionar —</option>
        <option value="MAXI">MAXI</option>
        <option value="BAUTI">BAUTI</option>
      </select>
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="err" id="login-err"></div>
    <button class="btn-gold" onclick="doLogin()">INGRESAR</button>
  </div>
</div>

<div class="screen" id="app">
  <div class="topbar">
    <div class="brand">VARCONE</div>
    <div class="user-pill">👤 <span id="cur-user">—</span></div>
    <button class="logout" onclick="doLogout()">✕</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="tab('nuevo')">+ NUEVO</button>
    <button class="tab-btn" onclick="tab('historial')">HISTORIAL</button>
  </div>
  <div class="tab-pane active" id="tab-nuevo">
    <div class="type-toggle">
      <button class="type-btn entrada active" id="btn-e" onclick="setTipo('ENTRADA')">↑ ENTRADA</button>
      <button class="type-btn salida"         id="btn-s" onclick="setTipo('SALIDA')">↓ SALIDA</button>
    </div>
    <div class="form-card">
      <div class="field">
        <label>Código SKU</label>
        <input class="big" type="text" id="inp-sku" placeholder="Z2121" autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="field">
        <label>Cantidad</label>
        <input class="big" type="number" id="inp-cant" placeholder="0" min="1" inputmode="numeric">
      </div>
      <button class="btn-submit e" id="btn-ok" onclick="submit()">REGISTRAR ENTRADA</button>
    </div>
  </div>
  <div class="tab-pane" id="tab-historial">
    <div id="hist-list"><div class="empty">Sin movimientos aún</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const USERS = { "MAXI": "maxi123", "BAUTI": "bau123" };
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwoaWnr60jqYbcdTzQZ6DenCES2V7xsTZpBXwosj5iXeCEyUwYPwd0ItRBu5c5gSeP7/exec";

let usuario = null, tipo = "ENTRADA", hist = [];

function doLogin() {
  const u = document.getElementById("sel-user").value;
  const p = document.getElementById("inp-pass").value;
  const err = document.getElementById("login-err");
  if (!u) { err.textContent = "Seleccioná un usuario."; return; }
  if (USERS[u] !== p) { err.textContent = "Contraseña incorrecta."; document.getElementById("inp-pass").value=""; return; }
  err.textContent = "";
  usuario = u;
  document.getElementById("cur-user").textContent = u;
  show("app");
  setTimeout(() => document.getElementById("inp-sku").focus(), 300);
}

function doLogout() {
  usuario = null;
  document.getElementById("sel-user").value = "";
  document.getElementById("inp-pass").value = "";
  show("login");
}

function setTipo(t) {
  tipo = t;
  document.getElementById("btn-e").classList.toggle("active", t==="ENTRADA");
  document.getElementById("btn-s").classList.toggle("active", t==="SALIDA");
  const btn = document.getElementById("btn-ok");
  btn.textContent = "REGISTRAR " + t;
  btn.className = "btn-submit " + (t==="ENTRADA" ? "e" : "s");
}

async function submit() {
  const sku  = document.getElementById("inp-sku").value.trim().toUpperCase();
  const cant = parseInt(document.getElementById("inp-cant").value);
  if (!sku)            { toast("Ingresá el código SKU.", true); return; }
  if (!cant || cant<1) { toast("Ingresá una cantidad válida.", true); return; }

  const now   = new Date();
  const fecha = now.toLocaleDateString("es-AR");
  const hora  = now.toLocaleTimeString("es-AR", {hour:"2-digit", minute:"2-digit"});

  const btn = document.getElementById("btn-ok");
  btn.disabled = true;
  btn.textContent = "ENVIANDO...";

  try {
    const params = new URLSearchParams({ fecha, hora, tipo, sku, cant, usuario });
    const res = await fetch(SCRIPT_URL + "?" + params.toString());
    const data = await res.json();

    if (data.ok) {
      hist.unshift({ fecha, hora, tipo, sku, cant, usuario });
      renderHist();
      document.getElementById("inp-sku").value = "";
      document.getElementById("inp-cant").value = "";
      document.getElementById("inp-sku").focus();
      toast(tipo==="ENTRADA" ? "✓ Entrada registrada en Sheets" : "✓ Salida registrada en Sheets");
    } else {
      toast("Error: " + (data.error || "desconocido"), true);
    }
  } catch(e) {
    toast("Error de conexión.", true);
  } finally {
    btn.disabled = false;
    btn.textContent = "REGISTRAR " + tipo;
  }
}

function renderHist() {
  const el = document.getElementById("hist-list");
  if (!hist.length) { el.innerHTML='<div class="empty">Sin movimientos aún</div>'; return; }
  el.innerHTML = hist.map(m=>`
    <div class="mov-item">
      <div class="mov-top">
        <span class="badge ${m.tipo==="ENTRADA"?"e":"s"}">${m.tipo}</span>
        <span class="mov-sku">${m.sku}</span>
      </div>
      <div class="mov-meta">Cantidad: <strong style="color:var(--text)">${m.cant}</strong> · ${m.fecha} ${m.hora} · ${m.usuario}</div>
    </div>`).join("");
}

function tab(id) {
  ["nuevo","historial"].forEach(t => document.getElementById("tab-"+t).classList.toggle("active", t===id));
  document.querySelectorAll(".tab-btn").forEach((b,i) => b.classList.toggle("active", (i===0&&id==="nuevo")||(i===1&&id==="historial")));
}

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function toast(msg, isErr=false) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast"+(isErr?" err":"");
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2800);
}

document.getElementById("inp-pass").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
document.getElementById("inp-cant").addEventListener("keydown", e => { if(e.key==="Enter") submit(); });
</script>
</body>
</html>
